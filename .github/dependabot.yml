---
# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ── Python dependencies ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Group minor/patch OpenAI SDK updates to reduce noise
      openai:
        patterns:
          - "openai"
        update-types:
          - "minor"
          - "patch"
      fastapi-stack:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"
      observability:
        patterns:
          - "opentelemetry*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Keep major version bumps as manual PRs — they may require code changes
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
